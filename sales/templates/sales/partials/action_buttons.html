
{% load group_tags %}
{% load humanize %}

<div class="detail-header-group">

    {% if flags.can_confirm %}
        <button
            type="button"
            class="btn btn-secondary js-loading-button"
            hx-post="{% url 'sales:confirm_sales_order' order.id %}"
            hx-target="#sales-display"
            hx-confirm="Confirm this Order?"
            hx-swap="innerHTML">
            <i class="bi bi-check-circle"></i> Confirm
        </button>
    {% endif %}

    {% if flags.can_send %}
        <button
            type="button"
            class="btn btn-secondary js-loading-button"
            hx-post="{% url 'sales:send_sales_order' order.id %}"
            hx-target="#sales-display"
            hx-confirm="Send this Order?"
            hx-swap="innerHTML">
            <i class="bi bi-check-circle"></i> Send Order
        </button>
    {% endif %}

    {% if flags.can_reset_to_draft %}
        <button
            type="button"
            class="btn btn-secondary js-loading-button"
            hx-post="{% url 'sales:reset_sales_order' order.id %}"
            hx-target="#sales-display"
            hx-confirm="Reset this Order? This will cancel active deliveries if they have not yet been processed."
            hx-swap="innerHTML">
            <i class="bi bi-arrow-counterclockwise"></i> Reset
        </button>
    {% endif %}

    {% if flags.can_cancel %}
        <button
            type="button"
            class="btn btn-secondary js-loading-button"
            hx-post="{% url 'sales:cancel_order' order.id %}"
            hx-target="#sales-display"
            hx-confirm="Cancel this Order? Active deliveries will also be cancelled if they have not yet been processed."
            hx-swap="innerHTML">
            <i class="bi bi-x-circle"></i> Cancel
        </button>
    {% endif %}

    {% if flags.can_delete %}
        <button
            type="button"
            class="btn btn-secondary js-loading-button"
            hx-post="{% url 'sales:order_delete' order.id %}"
            hx-target="#sales-display"
            hx-confirm="Delete this Order?"
            hx-swap="innerHTML">
            <i class="bi bi-trash"></i> Delete
        </button>
    {% endif %}

    {% if flags.can_mark_done %}
        <button
            type="button"
            class="btn btn-primary js-loading-button"
            hx-post="{% url 'sales:sales_to_invoice' order_id=order.id %}"
            hx-target="#sales-display"
            hx-swap="outerHTML"
            hx-confirm="Create an invoice from this sales order?"
            hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
            <i class="bi bi-receipt"></i> Convert to Invoice
        </button>
    {% endif %}

</div>

<div class="detail-header-group">
    <a href="{% url 'inventory:get_pickings' %}?picking_origin={{ order.order_number }}"
       class="btn btn-secondary">
        <i class="bi bi-box-seam"></i> Deliveries
    </a>
</div>
