{% load static %}
{% block content %}
<div class="app-container" style="display: flex; height: 100vh; overflow: hidden;">

    <div class="sidebar" style="width: 260px; background: #2c3e50; display: flex; flex-direction: column;">

        <div class="sidebar-header" style="height: 60px; padding: 20px; border-bottom: 1px solid #34495e;">
            </div>

        <div class="sidebar-search" style="padding: 15px;">
            <div style="height: 35px; background: #34495e; border-radius: 4px;"></div>
        </div>

        <div class="sidebar-menu" style="flex-grow: 1; overflow-y: auto; padding: 10px;">

            <div class="menu-group">
                <div class="group-label" style="height: 20px; width: 60%; background: #3e5871; margin-bottom: 10px;"></div>
                <div class="menu-item" style="height: 40px; margin-bottom: 5px; background: #34495e;"></div>
                <div class="menu-item" style="height: 40px; margin-bottom: 5px; background: #34495e;"></div>
                <div class="menu-item" style="height: 40px; margin-bottom: 20px; background: #34495e;"></div>
            </div>

            <div class="menu-group">
                <div class="group-label" style="height: 20px; width: 40%; background: #3e5871; margin-bottom: 10px;"></div>
                <div class="menu-item" style="height: 40px; margin-bottom: 5px; background: #34495e;"></div>
                <div class="menu-item" style="height: 40px; margin-bottom: 20px; background: #34495e;"></div>
            </div>

            <div class="menu-group">
                <div class="group-label" style="height: 20px; width: 50%; background: #3e5871; margin-bottom: 10px;"></div>
                <div class="menu-item" style="height: 40px; margin-bottom: 5px; background: #34495e;"></div>
                <div class="menu-item" style="height: 40px; margin-bottom: 5px; background: #34495e;"></div>
            </div>

        </div>

        <div class="sidebar-footer" style="padding: 20px; border-top: 1px solid #34495e;">
            <div style="height: 45px; background: #1abc9c; border-radius: 4px;"></div>
        </div>

    </div>

    <div class="main-content" style="flex-grow: 1; background: #f8f9fa; overflow-y: auto;">
        <div class="top-bar" style="height: 60px; background: white; border-bottom: 1px solid #dee2e6;"></div>
        <div class="report-container" style="padding: 30px;">
             </div>
    </div>

</div>

{% endblock %}
{% block scripts %}
{{ block.super }}
{% endblock %}
