
{% load group_tags %}
{% load humanize %}

<div class="detail-header-group">

    {# ── Journal actions ── #}

    {% if flags.can_post %}
        <button
            type="button"
            class="btn btn-secondary js-loading-button"
            hx-post="{% url 'accounting:post_journal' move.id %}"
            hx-target="#accounting-display"
            hx-confirm="Post this Journal?"
            hx-swap="innerHTML">
            <i class="bi bi-check-circle"></i> Post
        </button>
    {% endif %}


    {% if flags.can_delete %}
        <button
            type="button"
            class="btn btn-secondary js-loading-button"
            hx-post="{% url 'accounting:delete_journal' move.id %}"
            hx-target="#accounting-display"
            hx-confirm="Delete this Journal?"
            hx-swap="innerHTML">
            <i class="bi bi-trash"></i> Delete
        </button>
    {% endif %}


    {% if flags.can_cancel %}
        <button
            type="button"
            class="btn btn-secondary js-loading-button"
            hx-post="{% url 'accounting:cancel_journal' move.id %}"
            hx-target="#accounting-display"
            hx-confirm="Cancel this Journal? Once confirmed all stock and accounting entries will be reversed."
            hx-swap="innerHTML">
            <i class="bi bi-x-circle"></i> Cancel
        </button>
    {% endif %}

</div>

<div class="detail-header-group">
</div>
