<div
    class="modal fade"
    id="CreditNoteModal"
    tabindex="-1"
    aria-labelledby="creditModalLabel"
    aria-hidden="true" >
    
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            
            <!-- ================================================= -->
            <!-- Header -->
            <!-- ================================================= -->

            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="creditModalLabel"
                >
                    Issue Invoice Credit
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                ></button>

            </div>


            <!-- ================================================= -->
            <!-- Body -->
            <!-- ================================================= -->

            <div class="modal-body">


                <!-- Error -->
                <div
                    id="form-error"
                    style="
                        display:none;
                        padding:10px 14px;
                        background:var(--color-card-white);
                        color:#b91c1c;
                        border:1px solid #b91c1c;
                        border-radius:10px;
                        font-size:13px;
                        margin-bottom:12px;
                    "
                ></div>


                <form
                    id="credit-form"
                    method="post"
                >

                    {% csrf_token %}


                    <!-- Original invoice -->
                    <input
                        type="hidden"
                        name="invoice"
                        value="{{ invoice.id }}"
                    >


                    <!-- ================================================= -->
                    <!-- Product / Invoice Line Selector -->
                    <!-- ================================================= -->

                    <div
                        style="
                            margin-bottom:var(--spacing-12);
                        "
                    >

                        <div
                            class="toolbar"
                            style="
                                border-bottom:1px solid var(--color-mist);
                                padding-bottom:var(--spacing-12);
                            "
                        >

                            <div
                                class="toolbar-search-wrap"
                                style="flex:1;"
                            >

                                <select
                                    id="product-select"
                                    class="toolbar-search"
                                    style="
                                        padding-left:var(--spacing-12);
                                    "
                                >

                                    <option value="">
                                        — Select an invoice line to credit —
                                    </option>


                                    {% for line in credit_lines %}

                                        <option
                                            value="{{ line.id }}"

                                            data-product-name="{{ line.product.name }}"

                                            data-quantity="{{ line.quantity }}"

                                            data-amount="{{ line.subtotal }}"

                                            data-available-amount="{{ line.subtotal }}"

                                            data-product-id="{{ line.product.id }}"
                                        >

                                            {{ line.product.name }} ({{ line.product_uom}})

                                            —
                                            Qty:
                                            {{ line.quantity }}

                                            —
                                            Amount:
                                            {{ line.subtotal }}

                                        </option>

                                    {% endfor %}

                                </select>

                            </div>


                            <button
                                type="button"
                                class="btn btn-secondary"
                                id="add-product-btn"
                            >

                                <i class="bi bi-plus"></i>

                                Add Line

                            </button>

                        </div>

                    </div>


                    <!-- ================================================= -->
                    <!-- Credit Lines -->
                    <!-- ================================================= -->

                    <div class="inv-table-wrap">

                        <table
                            class="inv-table"
                            id="credit-items-table"
                        >

                            <thead>

                                <tr>

                                    <th style="width:220px;">
                                        Product
                                    </th>


                                    <th
                                        style="width:110px;"
                                        class="col-left"
                                    >
                                        Invoice Qty
                                    </th>


                                    <th
                                        style="width:150px;"
                                        class="col-right"
                                    >
                                        Invoice Amount
                                    </th>


                                    <th
                                        style="width:180px;"
                                        class="col-right"
                                    >
                                        Credit Amount
                                    </th>


                                    <th
                                        style="width:80px;"
                                        class="col-center"
                                    >
                                        Remove
                                    </th>

                                </tr>

                            </thead>


                            <tbody id="credit-items-body">

                                <tr id="no-items-row">

                                    <td
                                        colspan="5"
                                        class="table-empty"
                                    >

                                        <div
                                            class="table-empty-icon"
                                        >
                                            <i
                                                class="bi bi-inbox"
                                            ></i>
                                        </div>


                                        <div
                                            class="table-empty-title"
                                        >
                                            No products added yet
                                        </div>


                                        <div
                                            class="table-empty-desc"
                                        >
                                            Select an invoice line above
                                            and click Add Line.
                                        </div>

                                    </td>

                                </tr>

                            </tbody>

                        </table>

                    </div>

                </form>

            </div>


            <!-- ================================================= -->
            <!-- Footer -->
            <!-- ================================================= -->

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                >
                    Cancel
                </button>


                <button
                    type="button"
                    class="btn btn-primary"
                    id="submit-credit"
                    hx-post="{% url 'accounting:credit_invoice' invoice.id %}"

                    hx-include="#credit-form"

                    hx-disabled-elt="this"

                    hx-swap="none"
                >

                    <i
                        class="bi bi-check-circle"
                    ></i>

                    Create Credit Note

                </button>

            </div>

        </div>
    </div>
</div>
