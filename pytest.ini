    <div id="header-form-wrapper" class="po-header-form" data-url="{% url 'sales:ajax_customer_defaults' %}">
        <div class="row g-3">
            {% if errors %}
    <div class="alert alert-danger mb-3" id="header-errors">
      <strong>Please fix the following:</strong>
      <ul class="mb-0">
        {% for field, error_list in errors.items %}
          {% if error_list %}
            <li><strong>{{ field|title }}</strong>: {{ error_list.0 }}</li>
          {% endif %}
        {% endfor %}
      </ul>
    </div>
  {% endif %}

             <!-- Customer -->
    <div class="col-md-3">
        <label for="{{ header_form.customer.id_for_label }}" class="m-1" >
            Customer
            <button type="button"
                    class="po-action-btn "
                    style="margin-bottom: 2px;
                     border:1px solid var(--border); border-radius: 8px; background-color: var(--surface);"
                id="add-customer-btn"
                data-bs-toggle="modal"
                data-bs-target="#customerModal">
                <i class="bi bi-plus-circle"></i> Register
            </button>
        </label>
        {{ header_form.customer }}

    </div>

    <!-- Date -->
    <div class="col-md-2">
        <label for="{{ header_form.date.id_for_label }}"  class="m-1">Date</label>
        {{ header_form.date }}

    </div>

    <!-- Source Location -->
    <div class="col-md-2">
        <label for="{{ header_form.source_location.id_for_label }}" class="m-1" >Location
            Source Location
        </label>
        {{ header_form.source_location }}

    </div>
    <!-- Currency -->
    <div class="col-md-2">
        <label for="{{ header_form.currency.id_for_label }}" class="m-1">Currency</label>
        {{ header_form.currency }}

    </div>
    <!-- Payment Term -->
    <div class="col-md-3">
        <label for="{{ header_form.payment_term.id_for_label }}">
            Payment Term
        </label>
        {{ header_form.payment_term }}

    </div>
</div>
    </div>
